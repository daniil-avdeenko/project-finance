[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/routes/__init__.py" = ["F401"]
"tests/*" = ["F401"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["^app/models\\.py$", "^migrations/"]

[[tool.mypy.overrides]]
module = "app.models"
ignore_errors = true
